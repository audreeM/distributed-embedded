# Drivers
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_ADC=y

# main() is the lowest-priority app thread (default would be 0, above link RX)
CONFIG_MAIN_THREAD_PRIORITY=10

CONFIG_PWM=y
CONFIG_SENSOR=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Serial console commands: thr, open, gains, status
CONFIG_SHELL=y
