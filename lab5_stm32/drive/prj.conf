# Kconfig shared by both STM32 apps (each app's prj.conf is a copy of this file).
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=0
CONFIG_PWM=y
CONFIG_WATCHDOG=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

# lab 5
# main() only prints and feeds the watchdog: keep its slow printk below every real thread
CONFIG_MAIN_THREAD_PRIORITY=12
# serial input for the console commands (e / s / l)
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
# time sync math uses 64-bit division
CONFIG_CBPRINTF_FULL_INTEGRAL=y
# status prints format 64-bit numbers
CONFIG_MAIN_STACK_SIZE=2048
